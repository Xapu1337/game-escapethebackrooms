name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (vX.Y.Z)'
        required: true

# id-token: write is required for cosign keyless (OIDC) signing, without it cosign
# falls back to interactive device flow and the run hangs until the token expires.
# contents: write lets the release job create the GitHub Release and upload assets.
permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.0.0-unknown" >> $GITHUB_OUTPUT
          fi

      - name: Validate package.json version matches tag (if semantic)
        if: startsWith(steps.ver.outputs.tag, 'v') || startsWith(steps.ver.outputs.tag, '0')
        run: |
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y jq >/dev/null 2>&1 || true
          PKG_VER=$(jq -r .version package.json)
          TAG=${{ steps.ver.outputs.tag }}
          # Strip leading v if present
          TAG_STRIPPED=${TAG#v}
          if [[ "$PKG_VER" != "$TAG_STRIPPED" ]]; then
            echo "Package version ($PKG_VER) does not match tag ($TAG)." >&2
            exit 1
          fi
          echo "Version check passed: $PKG_VER == $TAG_STRIPPED"
      - name: Archive dist
        run: |
          cd dist
          zip -r "../extension-${{ steps.ver.outputs.tag }}.zip" .

      - name: Generate checksum
        run: |
          sha256sum "extension-${{ steps.ver.outputs.tag }}.zip" > "extension-${{ steps.ver.outputs.tag }}.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign artifact (cosign keyless if no key provided)
        run: |
          if [ -n "${COSIGN_KEY}" ]; then
            echo "Signing with provided key"
            cosign sign-blob --yes --key env://COSIGN_KEY --output-signature "extension-${{ steps.ver.outputs.tag }}.sig" "extension-${{ steps.ver.outputs.tag }}.zip"
          else
            echo "Keyless signing (OIDC)"
            cosign sign-blob --yes --output-signature "extension-${{ steps.ver.outputs.tag }}.sig" "extension-${{ steps.ver.outputs.tag }}.zip"
          fi
        env:
          COSIGN_EXPERIMENTAL: 1
          COSIGN_YES: 1

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: etb-vortex-extension
          path: |
            extension-${{ steps.ver.outputs.tag }}.zip
            extension-${{ steps.ver.outputs.tag }}.sha256
            extension-${{ steps.ver.outputs.tag }}.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: etb-vortex-extension
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.version }}
          name: ${{ github.ref_name != '' && github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/extension-*.zip
            artifacts/extension-*.sha256
            artifacts/extension-*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
